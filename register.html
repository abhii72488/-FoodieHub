<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Create a FoodieHub account to order food, track deliveries, and manage your profile."/>
  <title>Register — FoodieHub</title>
  <link rel="icon" href="assets/icons/favicon.ico"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
</head>
<body class="auth-page">

<div class="auth-container" style="max-width:520px">
  <div class="auth-logo">
    <a href="index.html" class="auth-logo-link" aria-label="FoodieHub Home">
      <span class="logo-icon">🍕</span>
      <span class="logo-text">Foodie<span class="logo-accent">Hub</span></span>
    </a>
  </div>

  <div class="auth-card">
    <div class="auth-header">
      <h1>Create Account 🎉</h1>
      <p>Join FoodieHub and start ordering today</p>
    </div>

    <div class="auth-alert" id="register-alert" role="alert" aria-live="assertive"></div>

    <form class="auth-form" id="register-form" novalidate aria-label="Registration form">
      <div class="form-group">
        <label class="form-label" for="reg-name">Full Name *</label>
        <input class="form-input" type="text" id="reg-name"
          placeholder="Your full name" required autocomplete="name" aria-required="true"/>
        <span class="field-error" id="reg-name-error" role="alert"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-email">Email Address *</label>
        <input class="form-input" type="email" id="reg-email"
          placeholder="you@example.com" required autocomplete="email" aria-required="true"/>
        <span class="field-error" id="reg-email-error" role="alert"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-password">Password *</label>
        <div class="password-field">
          <input class="form-input" type="password" id="reg-password"
            placeholder="Min. 8 characters" required autocomplete="new-password" aria-required="true" minlength="8"/>
          <button type="button" class="password-toggle" id="toggle-reg-pw" aria-label="Show password">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="password-strength" id="password-strength">
          <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
          <span class="strength-text" id="strength-text"></span>
        </div>
        <span class="field-error" id="reg-password-error" role="alert"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-confirm">Confirm Password *</label>
        <div class="password-field">
          <input class="form-input" type="password" id="reg-confirm"
            placeholder="Repeat your password" required autocomplete="new-password" aria-required="true"/>
          <button type="button" class="password-toggle" id="toggle-confirm-pw" aria-label="Show confirm password">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <span class="field-error" id="reg-confirm-error" role="alert"></span>
      </div>

      <div class="form-group">
        <label class="checkbox-group">
          <input type="checkbox" id="terms-agree" required aria-required="true"/>
          <label for="terms-agree">I agree to the <a href="#" style="color:var(--primary)">Terms & Conditions</a></label>
        </label>
        <span class="field-error" id="terms-agree-error" role="alert"></span>
      </div>

      <button type="submit" class="btn btn-primary auth-submit" id="register-submit-btn" aria-label="Create account">
        Create Account 🎉
      </button>
    </form>

    <p class="auth-footer-text" style="margin-top:var(--space-4)">
      Already have an account? <a href="login.html">Sign in here</a>
    </p>
  </div>
</div>

<script type="module" src="js/register.js"></script>
</body>
</html>
