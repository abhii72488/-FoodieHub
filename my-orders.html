<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="View your FoodieHub order history, track deliveries, and manage your orders."/>
  <title>My Orders — FoodieHub</title>
  <link rel="icon" href="assets/icons/favicon.ico"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
</head>
<body>

<header id="main-nav" role="banner"></header>

<div class="page-header">
  <div class="container">
    <h1>📦 My Orders</h1>
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a> <span>›</span>
      <span aria-current="page">My Orders</span>
    </nav>
  </div>
</div>

<main style="padding:var(--space-10) 0;min-height:60vh">
  <div class="container">
    <div id="orders-loading" class="loading-spinner" aria-label="Loading orders"></div>

    <div id="orders-content" style="display:none">
      <!-- Filter bar -->
      <div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-5);flex-wrap:wrap">
        <label for="order-status-filter" style="font-weight:600;font-size:var(--text-sm);color:var(--muted)">Filter by status:</label>
        <select class="sort-select" id="order-status-filter" aria-label="Filter orders by status" style="min-width:180px">
          <option value="all">All Orders</option>
          <option value="Pending">Pending</option>
          <option value="Confirmed">Confirmed</option>
          <option value="Preparing">Preparing</option>
          <option value="Out for Delivery">Out for Delivery</option>
          <option value="Delivered">Delivered</option>
          <option value="Cancelled">Cancelled</option>
        </select>
        <span id="orders-count" style="font-size:var(--text-sm);color:var(--muted);margin-left:auto" aria-live="polite"></span>
      </div>

      <div id="orders-list" role="list" aria-label="Order history"></div>
    </div>

    <div id="orders-empty" style="display:none" class="empty-state">
      <span class="empty-icon">📦</span>
      <h3 style="font-size:var(--text-2xl);font-weight:700">No Orders Yet</h3>
      <p>You haven't placed any orders. Start exploring our menu!</p>
      <a href="menu.html" class="btn btn-primary">🍽️ Browse Menu</a>
    </div>
  </div>
</main>

<footer role="contentinfo">
  <div class="container">
    <div class="footer-bottom" style="border-top:1px solid rgba(255,255,255,.1);padding-top:var(--space-5)">
      <p>© 2024 FoodieHub — Internship Demonstration Project.</p>
    </div>
  </div>
</footer>

<script type="module" src="js/orders.js"></script>
</body>
</html>
