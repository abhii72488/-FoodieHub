<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="View and manage your FoodieHub profile, order history, and delivery addresses."/>
  <title>My Profile — FoodieHub</title>
  <link rel="icon" href="assets/icons/favicon.ico"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
</head>
<body>

<header id="main-nav" role="banner"></header>

<div class="page-header">
  <div class="container">
    <h1>👤 My Profile</h1>
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a> <span>›</span>
      <span aria-current="page">Profile</span>
    </nav>
  </div>
</div>

<main style="padding:var(--space-10) 0">
  <div class="container">
    <div id="profile-loading" class="loading-spinner" aria-label="Loading profile"></div>
    <div id="profile-content" style="display:none">
      <div style="display:grid;grid-template-columns:280px 1fr;gap:var(--space-8);align-items:start">

        <!-- Profile sidebar -->
        <div class="card" style="text-align:center">
          <div style="width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-4);font-size:2.5rem;color:var(--white);font-weight:800" id="profile-avatar" aria-label="Profile avatar"></div>
          <h2 style="font-size:var(--text-xl);font-weight:700" id="profile-name-display"></h2>
          <p style="color:var(--muted);font-size:var(--text-sm);margin-top:4px" id="profile-email-display"></p>
          <div style="display:inline-block;background:var(--primary-pale);color:var(--primary);font-size:var(--text-xs);font-weight:700;padding:3px 10px;border-radius:var(--radius-full);margin-top:var(--space-3)" id="profile-role-badge">Customer</div>
          <hr style="margin:var(--space-5) 0;border:none;border-top:1px solid var(--border)"/>
          <nav aria-label="Profile navigation">
            <button class="dropdown-item" style="width:100%;justify-content:flex-start;padding:var(--space-3)" onclick="showTab('edit')" id="tab-edit-btn">✏️ Edit Profile</button>
            <a href="my-orders.html" class="dropdown-item" style="justify-content:flex-start;padding:var(--space-3)">📦 My Orders</a>
            <button class="dropdown-item logout-item" style="width:100%;justify-content:flex-start;padding:var(--space-3)" id="profile-logout-btn">🚪 Logout</button>
          </nav>
        </div>

        <!-- Profile tabs -->
        <div>
          <!-- Edit Profile Tab -->
          <div class="card" id="tab-edit">
            <h2 style="font-size:var(--text-xl);font-weight:800;margin-bottom:var(--space-5);padding-bottom:var(--space-3);border-bottom:2px solid var(--border)">Edit Profile</h2>
            <div class="auth-alert" id="profile-alert" role="alert" aria-live="assertive"></div>
            <form id="profile-form" novalidate aria-label="Edit profile form">
              <div class="form-group">
                <label class="form-label" for="edit-name">Full Name</label>
                <input class="form-input" type="text" id="edit-name" placeholder="Your full name" autocomplete="name"/>
                <span class="field-error" id="edit-name-error" role="alert"></span>
              </div>
              <div class="form-group">
                <label class="form-label" for="edit-email">Email Address</label>
                <input class="form-input" type="email" id="edit-email" disabled aria-disabled="true" title="Email cannot be changed here"/>
              </div>
              <div class="form-group">
                <label class="form-label" for="edit-phone">Phone Number</label>
                <input class="form-input" type="tel" id="edit-phone" placeholder="10-digit mobile number" maxlength="10" autocomplete="tel"/>
                <span class="field-error" id="edit-phone-error" role="alert"></span>
              </div>
              <div class="form-group">
                <label class="form-label" for="edit-address">Default Address</label>
                <textarea class="form-input" id="edit-address" rows="3" placeholder="Your delivery address…" autocomplete="street-address"></textarea>
              </div>
              <button type="submit" class="btn btn-primary" id="profile-save-btn" aria-label="Save profile changes">
                💾 Save Changes
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer role="contentinfo">
  <div class="container">
    <div class="footer-bottom" style="border-top:1px solid rgba(255,255,255,.1);padding-top:var(--space-5)">
      <p>© 2024 FoodieHub — Internship Demonstration Project.</p>
    </div>
  </div>
</footer>

<script type="module" src="js/profile.js"></script>
</body>
</html>
