<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="View food item details, select quantity, and add to your cart on FoodieHub."/>
  <title>Food Details — FoodieHub</title>
  <link rel="icon" href="assets/icons/favicon.ico"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
</head>
<body>

<header id="main-nav" role="banner"></header>

<div class="page-header">
  <div class="container">
    <h1 id="details-page-title">Food Details</h1>
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <span aria-hidden="true">›</span>
      <a href="menu.html">Menu</a>
      <span aria-hidden="true">›</span>
      <span aria-current="page" id="details-breadcrumb">Details</span>
    </nav>
  </div>
</div>

<main style="padding:var(--space-10) 0" id="food-details-main">
  <div class="container">
    <div class="loading-spinner" id="details-loading" aria-label="Loading food details"></div>
    <div id="details-content" style="display:none"></div>
    <div id="details-error" style="display:none" class="error-state">
      <span>⚠️</span>
      <p>Food item not found or unavailable.</p>
      <a href="menu.html" class="btn btn-primary">Back to Menu</a>
    </div>
  </div>
</main>

<!-- Related Items -->
<section style="padding:var(--space-10) 0;background:var(--border-light)" id="related-section" aria-labelledby="related-heading" hidden>
  <div class="container">
    <div class="section-header">
      <h2 class="section-title" id="related-heading">You Might Also Like</h2>
    </div>
    <div class="food-grid" id="related-grid" role="list"></div>
  </div>
</section>

<footer role="contentinfo">
  <div class="container">
    <div class="footer-bottom" style="border-top:1px solid rgba(255,255,255,.1);padding-top:var(--space-5)">
      <p>© 2024 FoodieHub — Internship Demonstration Project.</p>
      <a href="menu.html" style="color:var(--primary-light)">← Back to Menu</a>
    </div>
  </div>
</footer>

<script type="module" src="js/food-details.js"></script>
</body>
</html>
