<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Your FoodieHub order has been placed successfully. Track your delivery status."/>
  <title>Order Confirmed — FoodieHub</title>
  <link rel="icon" href="assets/icons/favicon.ico"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/cart.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
</head>
<body>

<header id="main-nav" role="banner"></header>

<main class="confirmation-page">
  <div class="confirmation-card">
    <div class="confirmation-icon" aria-hidden="true">✅</div>
    <h1>Order Placed!</h1>
    <p>Thank you for your order. We've received it and it's being prepared!</p>

    <div class="order-id-display" id="conf-order-id" aria-label="Order ID">Loading…</div>

    <div style="margin:var(--space-5) 0;text-align:left;background:var(--border-light);border-radius:var(--radius-md);padding:var(--space-4)" id="conf-details">
      <!-- Populated by order-confirmation.js -->
    </div>

    <!-- Status tracker -->
    <div style="margin:var(--space-6) 0" aria-label="Order status tracker">
      <div style="display:flex;justify-content:space-between;position:relative;padding:0 var(--space-4)">
        <div style="position:absolute;top:14px;left:calc(var(--space-4) + 14px);right:calc(var(--space-4) + 14px);height:3px;background:var(--border);z-index:0"></div>
        <div style="position:absolute;top:14px;left:calc(var(--space-4) + 14px);width:30%;height:3px;background:linear-gradient(90deg,var(--primary),var(--secondary));z-index:1;transition:width 1s ease" id="status-bar"></div>
        <div class="status-step active" data-step="1">
          <div class="step-dot" style="width:30px;height:30px;border-radius:50%;background:var(--primary);color:var(--white);display:flex;align-items:center;justify-content:center;font-size:var(--text-xs);font-weight:700;position:relative;z-index:2">✅</div>
          <div style="font-size:10px;margin-top:4px;color:var(--primary);font-weight:700">Placed</div>
        </div>
        <div class="status-step" data-step="2">
          <div style="width:30px;height:30px;border-radius:50%;background:var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:var(--text-xs);font-weight:700;position:relative;z-index:2">👨‍🍳</div>
          <div style="font-size:10px;margin-top:4px;color:var(--muted)">Preparing</div>
        </div>
        <div class="status-step" data-step="3">
          <div style="width:30px;height:30px;border-radius:50%;background:var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:var(--text-xs);font-weight:700;position:relative;z-index:2">🛵</div>
          <div style="font-size:10px;margin-top:4px;color:var(--muted)">On the way</div>
        </div>
        <div class="status-step" data-step="4">
          <div style="width:30px;height:30px;border-radius:50%;background:var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:var(--text-xs);font-weight:700;position:relative;z-index:2">📦</div>
          <div style="font-size:10px;margin-top:4px;color:var(--muted)">Delivered</div>
        </div>
      </div>
    </div>

    <p style="font-size:var(--text-sm);color:var(--muted);margin-bottom:var(--space-2)">
      Estimated delivery time: <strong>30–45 minutes</strong> (Demonstration estimate)
    </p>

    <div class="confirmation-actions">
      <a href="my-orders.html" class="btn btn-primary" aria-label="Track your order">
        📦 Track Order
      </a>
      <a href="menu.html" class="btn btn-outline" aria-label="Order more food">
        🍽️ Order More
      </a>
    </div>
  </div>
</main>

<script type="module" src="js/order-confirmation.js"></script>
</body>
</html>
