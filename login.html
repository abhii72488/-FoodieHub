<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Log in to your FoodieHub account to track orders and manage your profile."/>
  <title>Login — FoodieHub</title>
  <link rel="icon" href="assets/icons/favicon.ico"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
</head>
<body class="auth-page">

<div class="auth-container">
  <div class="auth-logo">
    <a href="index.html" class="auth-logo-link" aria-label="FoodieHub Home">
      <span class="logo-icon">🍕</span>
      <span class="logo-text">Foodie<span class="logo-accent">Hub</span></span>
    </a>
  </div>

  <div class="auth-card">
    <div class="auth-header">
      <h1>Welcome Back! 👋</h1>
      <p>Sign in to your FoodieHub account</p>
    </div>

    <!-- Alert area -->
    <div class="auth-alert" id="login-alert" role="alert" aria-live="assertive"></div>

    <form class="auth-form" id="login-form" novalidate aria-label="Login form">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <input class="form-input" type="email" id="login-email"
          placeholder="you@example.com" required autocomplete="email" aria-required="true"/>
        <span class="field-error" id="login-email-error" role="alert"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <div class="password-field">
          <input class="form-input" type="password" id="login-password"
            placeholder="Your password" required autocomplete="current-password" aria-required="true"/>
          <button type="button" class="password-toggle" id="toggle-login-pw" aria-label="Show password">
            <svg id="eye-icon-login" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <span class="field-error" id="login-password-error" role="alert"></span>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-5)">
        <label class="checkbox-group">
          <input type="checkbox" id="remember-me" aria-label="Remember me"/>
          <label for="remember-me">Remember me</label>
        </label>
        <a href="#" class="forgot-link" id="forgot-password-link" style="margin:0">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-primary auth-submit" id="login-submit-btn" aria-label="Sign in">
        Sign In →
      </button>
    </form>

    <div class="auth-divider">
      <span>New to FoodieHub?</span>
    </div>

    <p class="auth-footer-text">
      Don't have an account? <a href="register.html">Create one here</a>
    </p>
  </div>
</div>

<script type="module" src="js/login.js"></script>
</body>
</html>
